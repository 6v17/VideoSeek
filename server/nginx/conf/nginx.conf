# VideoSeek team media server — main config (rarely touched by the app).
# App-generated site config lives in conf.d/*.conf

worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    sendfile        on;
    keepalive_timeout  65;

    # Large video files / Range seek
    client_max_body_size 0;
    types_hash_max_size 2048;

    access_log  logs/access.log;

    # Split site configs (Linux-style)
    include  conf.d/*.conf;
}
