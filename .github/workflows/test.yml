name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: VideoSeek
          environment-file: environment.yml
          auto-update-conda: true
          python-version: "3.10"

      - name: No BOM
        run: python scripts/check_no_bom.py

      - name: Ruff
        run: python -m ruff check src ui tests scripts main.py

      # Do NOT conda-install ffmpeg: its shared DLLs collide with PySide6 on Windows
      # runners (QtCore/QtGui "procedure could not be found" at collection).
      - name: FFmpeg (CI)
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "ffmpeg-ci"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $dest "ffmpeg.zip"
          $uri = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $uri -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $bin = Get-ChildItem -Path $dest -Recurse -Directory -Filter bin |
            Where-Object { Test-Path (Join-Path $_.FullName "ffmpeg.exe") } |
            Select-Object -First 1
          if (-not $bin) { throw "ffmpeg.exe not found after extract" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin.FullName
          & (Join-Path $bin.FullName "ffmpeg.exe") -version | Select-Object -First 1

      - name: Run tests
        timeout-minutes: 30
        run: python -m pytest tests/ -q --tb=line
