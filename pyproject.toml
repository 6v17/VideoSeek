[project]
name = "VideoSeek"
version = "1.0.87"
requires-python = ">=3.10"
description = "Local semantic video search desktop app"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "ui", "tests", "scripts"]

[tool.ruff.lint]
# Start narrow: syntax/undefined-name class failures only. Expand later.
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["F821"]
