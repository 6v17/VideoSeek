[project]
name = "VideoSeek"
version = "1.0.92"
requires-python = ">=3.10"
description = "Local semantic video search desktop app"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "ui", "tests", "scripts"]

[tool.ruff.lint]
# Pyflakes plus import/statement sanity. E402 stays ignored: lazy imports break cycles.
select = [
    "F",
    "E4",
    "E7",
    "E9",
]
ignore = [
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["F821"]
